<nav class="navbar">
  <div class="logo-container" aria-label="Thyronex Care Diagnostics">
    <img
      class="logo-image"
      src="/android-chrome-192x192.png"
      alt="Thyronex Care Diagnostics logo"
    />
    <div class="brand-text-block">
      <span class="logo-text">Thyronex Care Diagnostics</span>
      <span class="tagline">Where Accuracy Meets Care</span>
    </div>
  </div>

  <div class="nav-actions">
    @if (!isLoggedIn) {
      <button class="login-trigger-btn" (click)="triggerLogin.emit()">Login</button>
    } @else {
      <div class="user-session-group">
        <!-- 1. Welcome User First -->
        <span class="welcome-label">Welcome, <strong>{{ userName }}</strong></span>
        
        <!-- 2. My Bookings Next -->
        <button class="nav-link-btn" (click)="triggerDashboard.emit()">My Bookings</button>
        
        <!-- 3. Logout Last -->
        <button class="logout-outline-btn" (click)="triggerLogout.emit()">Logout</button>
      </div>
    }
  </div>
</nav>
