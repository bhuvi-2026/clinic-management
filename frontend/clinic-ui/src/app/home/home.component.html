<!-- Wrapper to control the view -->
<div class="main-container">
  
  @if (currentView === 'dashboard') {
  <div class="popup-overlay" (click)="currentView = 'home'">
    <div class="popup-content" (click)="$event.stopPropagation()">
      <button class="close-popup" (click)="currentView = 'home'">×</button>
      
      <app-user-dashboard 
      [mobile]="loggedInUserMobile"
        [name]="userName" 
        [email]="userEmail"
        (backToHome)="currentView = 'home'">
      </app-user-dashboard>
    </div>
  </div>
}
  @else {
    <!-- Landing Page Content -->
    <section class="hero">
      <div class="hero-content">
        <h1>Trusted lab testing, <span class="highlight">booked online with ease</span></h1>
        <p>Fast, reliable diagnostics from accredited labs with convenient home collection.</p>
        <div class="hero-actions">
          <button class="lab-btn" (click)="scrollToLab()">Book Your Test</button>
        </div>
      </div>

      <div class="hero-image-container">
        <div class="image-wrapper main-image">
          <img src="https://images.unsplash.com/photo-1576091160550-2173dba999ef?q=80&w=800" alt="Medical lab and testing">
        </div>
        <div class="image-wrapper secondary-image">
          <img src="https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=800" alt="Diagnostic testing">
        </div>
      </div>
    </section>

    <div id="target-section">
      
        <app-lab-tests id="lab-list" [isLoggedIn]="isLoggedIn" (loginRequired)="showLoginOverlay = true">
        </app-lab-tests>
    </div>
  }
</div>

<!-- Login Overlay stays global -->
@if (showLoginOverlay) {
  <app-login (loginSuccess)="handleLoginSuccess($event)" (closeLogin)="closeOverlay()">
  </app-login>
}
