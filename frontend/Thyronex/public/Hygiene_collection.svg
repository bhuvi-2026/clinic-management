<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <!-- Outer Rounded Border -->
  <rect x="105" y="20" width="475" height="260" rx="28" ry="28" fill="#ffffff" stroke="#0e2340" stroke-width="4"/>
  
  <!-- Left Navy Icon Container -->
  <rect x="30" y="55" width="180" height="190" rx="24" ry="24" fill="#0e2340"/>
  
  <!-- Icon: Phlebotomist Collection Bag & Sterile Shielded Blood Vial -->
  <g transform="translate(60, 85)">
    <!-- Shield / Protection -->
    <path d="M60 5 C35 15 15 15 15 45 C15 80 45 110 60 120 C75 110 105 80 105 45 C105 15 85 15 60 5 Z" fill="#14345c" stroke="#38bdf8" stroke-width="3"/>
    <!-- Medical Cross -->
    <path d="M54 45 h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12 z" fill="#ffffff"/>
    <!-- Sterile Vacuum Blood Tube -->
    <rect x="70" y="30" width="22" height="65" rx="10" fill="#ffffff" stroke="#0e2340" stroke-width="2.5"/>
    <rect x="68" y="22" width="26" height="14" rx="4" fill="#ef4444"/>
    <path d="M72 55 h18 v28 C90 89 85 93 79 93 C75 93 72 89 72 83 Z" fill="#dc2626"/>
  </g>

  <!-- Right Typography -->
  <text x="235" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#d01110" letter-spacing="-0.5">
    100% Safe &amp;
  </text>
  <text x="235" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#0e2340">
    Hygienic Home
  </text>
  <text x="235" y="215" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#0e2340">
    Sample Collection
  </text>
</svg>
