<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- Clock Box Gradient -->
    <linearGradient id="clockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
  </defs>

  <!-- Outer Card Outline Container -->
  <rect x="130" y="24" width="545" height="272" rx="28" fill="#ffffff" stroke="#091e3a" stroke-width="4.5" />

  <!-- Left Clock Icon Badge (Navy Filled Card) -->
  <g filter="url(#badgeShadow)">
    <rect x="36" y="58" width="204" height="204" rx="26" fill="url(#clockBg)" />

    <!-- Alarm Clock Bell Ears -->
    <!-- Left Ear -->
    <path d="M 68 98 C 62 88, 70 74, 84 78 C 94 80, 94 92, 86 100 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="82" y1="84" x2="88" y2="92" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Right Ear -->
    <path d="M 208 98 C 214 88, 206 74, 192 78 C 182 80, 182 92, 190 100 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="194" y1="84" x2="188" y2="92" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Clock Top Hammer / Button -->
    <rect x="130" y="80" width="16" height="8" rx="2" fill="#ffffff" />
    <line x1="126" y1="88" x2="150" y2="88" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Clock Feet -->
    <line x1="82" y1="228" x2="68" y2="246" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="194" y1="228" x2="208" y2="246" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

    <!-- Clock Dial Body -->
    <circle cx="138" cy="160" r="62" fill="none" stroke="#ffffff" stroke-width="5" />

    <!-- Hour Markers -->
    <!-- 12, 3, 6, 9 -->
    <line x1="138" y1="106" x2="138" y2="116" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <line x1="192" y1="160" x2="182" y2="160" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <line x1="138" y1="214" x2="138" y2="204" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <line x1="84" y1="160" x2="94" y2="160" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Diagonal ticks -->
    <circle cx="169" cy="129" r="2.5" fill="#ffffff" />
    <circle cx="169" cy="191" r="2.5" fill="#ffffff" />
    <circle cx="107" cy="191" r="2.5" fill="#ffffff" />
    <circle cx="107" cy="129" r="2.5" fill="#ffffff" />

    <!-- Clock Hands (Indicating Precision Time) -->
    <!-- Hour hand pointing up/slight right -->
    <line x1="138" y1="160" x2="138" y2="124" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <!-- Minute hand pointing down-right -->
    <line x1="138" y1="160" x2="162" y2="182" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Center Pivot Pin -->
    <circle cx="138" cy="160" r="5" fill="#091e3a" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Typography Content (Right Side) -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Header: 98% Reports -->
    <text x="460" y="104" fill="#c91414" font-size="44" font-weight="900" letter-spacing="-0.5px">
      98% Reports
    </text>

    <!-- Subtitle: released within -->
    <text x="460" y="144" fill="#091e3a" font-size="25" font-weight="800" letter-spacing="-0.2px">
      released within
    </text>

    <!-- Highlight: 20 to 24 Hours -->
    <text x="460" y="200" fill="#c91414" font-size="44" font-weight="900" letter-spacing="-0.5px">
      20 to 24 Hours
    </text>

    <!-- Footnote / Detail: of sample reaching the lab* -->
    <text x="460" y="244" fill="#091e3a" font-size="22" font-weight="800" letter-spacing="-0.2px">
      of sample reaching the lab*
    </text>
  </g>
</svg>
