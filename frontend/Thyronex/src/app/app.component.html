<app-header 
  [isLoggedIn]="isLoggedIn" 
  [userName]="userName"
  (triggerLogin)="showLoginOverlay = true" 
  (triggerLogout)="handleLogout()"
  (triggerDashboard)="home.switchToDashboard()">
</app-header>

<app-home #home
  [isLoggedIn]="isLoggedIn"
  [loginTrigger]="showLoginOverlay"
  [userName]="userName"
  [userEmail]="userEmail"
  (loginStateChange)="onLoginSuccess($event)"
  (closeLogin)="handleModalClose()">
</app-home>

<app-footer></app-footer>
