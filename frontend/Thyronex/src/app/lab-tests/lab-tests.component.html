<div class="lab-container">

  <div class="category-section">
    <div class="category-header">
      <h2>Find Tests & Packages by Health Concern</h2>
      <p>Select a category to explore diagnostic tests tailored for you</p>
    </div>

    <div class="category-grid">
      
      <div class="category-card" (click)="onSelectCategory('HEART_HEALTH')">
        <div class="category-content">
          <div class="category-text">
            <h3>Heart Health <span>Package</span></h3>
          </div>
          <div class="category-logo heart-bg">
            <svg viewBox="0 0 64 64" fill="none">
              <defs>
                <linearGradient id="heartGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ff6b6b"/>
                  <stop offset="100%" stop-color="#ee5253"/>
                </linearGradient>
              </defs>
              <path d="M32 12C28-4 4-4 4 20c0 16 16 28 28 36 12-8 28-20 28-36 0-24-24-24-28-8z" fill="url(#heartGrad)" filter="url(#dropShadow)"/>
              <polyline points="18,24 26,24 30,14 34,34 38,24 46,24" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="category-card" (click)="onSelectCategory('DIABETIC_CARE')">
        <div class="category-content">
          <div class="category-text">
            <h3>Diabetic Care <span>Package</span></h3>
          </div>
          <div class="category-logo diabetic-bg">
            <svg viewBox="0 0 64 64" fill="none">
              <defs>
                <linearGradient id="bloodGrad" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ff7f7f"/>
                  <stop offset="100%" stop-color="#e60000"/>
                </linearGradient>
              </defs>
              <path d="M32 4C20 16 8 28 8 40c0 14 10 20 24 20s24-6 24-20C56 28 44 16 32 4z" fill="url(#bloodGrad)"/>
              <rect x="26" y="32" width="12" height="18" rx="2" fill="white" opacity="0.8"/>
              <line x1="32" y1="36" x2="32" y2="46" stroke="#e60000" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="category-card" (click)="onSelectCategory('BONE_PROFILE')">
        <div class="category-content">
          <div class="category-text">
            <h3>Bone <span>Profile</span></h3>
          </div>
          <div class="category-logo bone-bg">
            <svg viewBox="0 0 64 64" fill="none">
              <defs>
                <linearGradient id="boneGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#f6e0b3"/>
                  <stop offset="100%" stop-color="#eac082"/>
                </linearGradient>
              </defs>
              <path d="M48 10a6 6 0 1 0-12 0 6 6 0 1 0-12 0 6 6 0 1 0-12 0C4 18 4 36 12 54a6 6 0 1 0 12 0 6 6 0 1 0 12 0 6 6 0 1 0 12 0c8-18 8-36 0-54z" fill="url(#boneGrad)"/>
              <circle cx="32" cy="32" r="6" fill="#1a5f6e" opacity="0.3"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="category-card" (click)="onSelectCategory('THYROID_PROFILE')">
        <div class="category-content">
          <div class="category-text">
            <h3>Thyroid <span>Profile</span></h3>
          </div>
          <div class="category-logo thyroid-bg">
            <svg viewBox="0 0 64 64" fill="none">
              <defs>
                <linearGradient id="thyroidGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#c792ea"/>
                  <stop offset="100%" stop-color="#9c27b0"/>
                </linearGradient>
              </defs>
              <path d="M32 20c-4-8-16-12-24-4s0 20 8 28c4 4 12 8 16 8 4 0 12-4 16-8 8-8 16-20 8-28s-20 4-24 4z" fill="url(#thyroidGrad)"/>
              <ellipse cx="32" cy="36" rx="6" ry="12" fill="white" opacity="0.4"/>
            </svg>
          </div>
        </div>
      </div>

    </div>
  </div>
  <!-- The Modal rendered inside the Lab component -->
  @if (selectedPackage) {
    <app-lab-booking-modal 
      [package]="selectedPackage" 
      (closeForm)="closeModal()">
    </app-lab-booking-modal>
  }
</div>
