# ==============================================================================
# 1. DATABASE CONNECTIVITY (AWS RDS / PRODUCTION)
# ==============================================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate / JPA & Auto-Seeding Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging Configuration
logging.file.name=logs/DoctorBooking.log
logging.level.root=INFO

# ==============================================================================
# 2. MAIL CONFIGURATION (SMTP)
# ==============================================================================
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================================================================
# 3. EXTERNAL SERVICES & OWNER DETAILS
# ==============================================================================
whatsapp.api.url=${WHATSAPP_API_URL}
business.email=${BUSINESS_EMAIL}
lab.owner.email=${LAB_OWNER_EMAIL}
lab.owner.whatsapp=${LAB_OWNER_WHATSAPP_NUMBER}

# ==============================================================================
# 4. SECURITY & CONTACT DETAILS
# ==============================================================================
admin.secret.key=${ADMIN_SECRET_KEY}

lab.contact.phone=${LAB_CONTACT_PHONE}
lab.contact.name=${LAB_CONTACT_NAME}
lab.contact.timings=${LAB_CONTACT_TIMINGS}

# Allow larger payloads for PDF report uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
# ==============================================================================
# OTP AUTHENTICATION & DEMO MOCK CONFIGURATION
# ==============================================================================
# When true, bypasses cellular SMS and enforces predefined static OTPs
app.otp.mock-enabled=true

# Fallback OTP for any valid non-whitelisted test number
app.otp.default-fallback-otp=123456

# Comma-separated list of mobile:otp pairs for the 3 demo numbers
app.otp.whitelisted-numbers=9513951931:111111,8310351368:222222,7026449346:333333


